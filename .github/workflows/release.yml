# 五平台发布：tag 推送（v*）时在原生 runner 构建，产物自动挂到 GitHub Release
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # keyring 的 sync-secret-service 在 Linux 上走 dbus，runner 缺头文件会挂在构建脚本
      - name: Linux dbus 依赖
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - name: 构建
        run: cargo build --release --target ${{ matrix.target }}
      - name: 打包
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            # Windows runner 没有 zip 命令，用系统自带的 Compress-Archive
            powershell -NoProfile -Command "Compress-Archive -Path keyx.exe -DestinationPath 'keyx-${{ matrix.target }}.zip' -Force"
            cp "keyx-${{ matrix.target }}.zip" "$GITHUB_WORKSPACE/"
          else
            tar czf "keyx-${{ matrix.target }}.tar.gz" keyx
            cp "keyx-${{ matrix.target }}.tar.gz" "$GITHUB_WORKSPACE/"
          fi
      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: "keyx-*"
